name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,bench]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Run tests with coverage (warnings are errors)
        run: python -m pytest -v --cov --cov-report=term-missing
      - name: SYNTHETIC demo smoke run
        run: |
          python examples/synthetic_demo.py
          python benchmarks/synthetic_reference_eval.py
          python benchmarks/warmup_sweep.py

  core-only:
    name: Core install without scikit-learn (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with numpy only
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('sklearn') is not None)"
      - name: Run tests (scikit-learn tests skip, warnings are errors)
        run: python -m pytest -rs
      - name: CLI smoke run
        run: python -c "print('\n'.join(str(i % 7) for i in range(32 * 40)))" | streamguard --warmup 8 > /dev/null
