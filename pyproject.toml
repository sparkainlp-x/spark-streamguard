[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-streamguard"
version = "0.1.0.dev0"
description = "Streaming, fail-closed guardrail for numeric data in 32-value blocks: weighted residual score, admit/latch with reason codes, self-calibrated threshold, JSONL audit log. Research prototype."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jean-François Brisson" }]
dependencies = ["numpy>=1.23"]
keywords = ["anomaly detection", "streaming", "fail-closed", "guardrail", "audit log"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.9"]

[project.scripts]
streamguard = "streamguard.cli:main"

[project.urls]
Homepage = "https://sparkainlpx.xyz"
Repository = "https://github.com/sparkainlp-x/spark-streamguard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["streamguard"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM300"]
