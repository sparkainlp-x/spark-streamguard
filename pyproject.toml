[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-streamguard"
version = "0.1.0.dev0"
description = "A fail-closed, auditable gate for any streaming detector: pluggable block scorers (EWMA chart default), admit/latch with reason codes, self-calibrated threshold, sequence-gap check, JSONL audit log. Research prototype."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jean-François Brisson" }]
dependencies = ["numpy>=1.23"]
keywords = ["anomaly detection", "streaming", "fail-closed", "guardrail", "audit log"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.9"]
# Real-data benchmark only (benchmarks/real/); the library itself needs numpy only.
bench = ["scikit-learn>=1.3", "scipy>=1.10"]
# Optional IsolationForest scorer (StreamGuard(scorer="isoforest")).
isoforest = ["scikit-learn>=1.3"]

[project.scripts]
streamguard = "streamguard.cli:main"

[project.urls]
Homepage = "https://sparkainlpx.xyz"
Repository = "https://github.com/sparkainlp-x/spark-streamguard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["streamguard"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM300"]

[tool.ruff.lint.isort]
known-first-party = ["streamguard"]
known-local-folder = ["protocol", "data", "download", "run", "make_tables", "nab_official", "gate", "pivot"]
